name = "MagicDrop"
client_id = "SHOPIFY_API_KEY_PLACEHOLDER"
application_url = "https://your-app-url.com"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://your-app-url.com/auth/callback",
  "https://your-app-url.com/auth/shopify/callback",
  "https://your-app-url.com/api/auth/callback"
]

[webhooks]
api_version = "2024-04"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://your-app-url.com/api/webhooks/privacy/customer-deletion"
  customer_data_request_url = "https://your-app-url.com/api/webhooks/privacy/customer-data-request"
  shop_deletion_url = "https://your-app-url.com/api/webhooks/privacy/shop-deletion"

[pos]
embedded = false
